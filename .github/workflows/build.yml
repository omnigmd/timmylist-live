name: Build Timmylist Live

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          combine: false

      - uses: actions/upload-artifact@v4
        with:
          name: Timmylist Live
          path: ${{ steps.build.outputs.build-output }}
